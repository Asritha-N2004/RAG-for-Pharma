server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 51m;
    # Docker can assign a new address after a backend container restart.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_origin http://backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    location /api/ { proxy_pass $backend_origin; proxy_read_timeout 120s; }
    location = /health { proxy_pass $backend_origin; }
    location /docs { proxy_pass $backend_origin; }
    location /openapi.json { proxy_pass $backend_origin; }
    location / { try_files $uri /index.html; }
}
