services:
  tls:
    image: caddy:2.10.0-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to the registered public domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: {condition: service_healthy}
    restart: unless-stopped
    networks: [internal]
volumes:
  caddy_data:
  caddy_config:
